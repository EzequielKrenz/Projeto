<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fjalla+One&display=swap" rel="stylesheet">
</head>

<body>
    <p class="nome">Lucia</p>
    <img class="personagem" src="lucia.png" alt="Lucia, personagem do jogo GTA-IV">

    <div class="textos">
        <p class="descricao">Selecione as opções <br> dos jogadores</p>
        <h1>Não é só <br> um jogo</h1>
        <p class="texto-apoio">Escolha seu personagem, ou tranforme uma foto sua em um personagem.</p>
    </div>
    <div class="menu">
        <img onclick="escolherPersonagem('Lucia', 'lucia.png')" class="avatar" src="lucia.png" alt="Selecionar Lucia">
        <img onclick="escolherPersonagem('Jason', 'jason.png')" class="avatar" src="jason.png" alt="Selecionar Jason">
        <img onclick="escolherPersonagem('CJ', 'cj.png')" class="avatar" src="cj.png" alt="Selecionar CJ">
        <button class="voce">Escolher</button>
    </div>
    <div class="">
        
    </div>
    <footer>
        <p>© 2026 GTA - Todos os direitos reservados</p>
    <script src="Script.js">
    </script>
</body>
</html>
